<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Notchy">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="114.5" ry="114.5"/>
    </clipPath>
  </defs>

  <!-- Flat charcoal squircle -->
  <rect x="0" y="0" width="512" height="512" rx="114.5" ry="114.5" fill="#1b1e26"/>

  <!-- The notch: flat top, rounded bottom corners, clipped to the squircle -->
  <g clip-path="url(#squircle)">
    <rect x="107.52" y="-66.56" width="296.96" height="322.56" rx="66.56" ry="66.56" fill="#000000"/>
  </g>

  <!-- Eyes: two flat status dots -->
  <circle cx="192" cy="130.56" r="33.79" fill="#f4f4f5"/>
  <circle cx="320" cy="130.56" r="33.79" fill="#f4f4f5"/>
</svg>
